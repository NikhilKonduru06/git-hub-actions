name: portfolio

on:
    push:
        branches: [main]

permissions:
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{steps.deployment.outputs.page_yrl}}
        
        steps:
            #Get access to your profilio code via pre-built actions
            #clones ot checks out the code where the workflow is written
            #STEP 1
            - name: Checkout Code
              uses: actions/checkout@v4
            
            #Set up Github Pages
            #STEP 2
            - name: Setup Github Pages
              uses: actions/configure-pages@v4
            
            #static code artifacts
            #STEP 3
            - name: Upload static files
              uses: actions/upload-pages-artifact@v4
            
            #make page live
            #STEP 4
            - name: Deploy to Github pages
              uses: actions/deploy-pages@v4
